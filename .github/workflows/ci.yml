name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-binary:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Build Windows executable
        run: >
          uv run pyinstaller --onefile --name jma-data-mcp
          --collect-data jma_data_mcp
          --copy-metadata fastmcp
          jma_data_mcp/__main__.py

      - name: Smoke test executable
        shell: pwsh
        run: |
          dist\jma-data-mcp.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Executable help failed" }
          $output = dist\jma-data-mcp.exe station get --code 44132
          if ($LASTEXITCODE -ne 0) { throw "Station lookup failed" }
          $station = $output | ConvertFrom-Json
          if ($station.code -ne "44132") { throw "Station data missing or incorrect" }

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --frozen

      - name: Setup Node for Sites contract checks
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Sites Worker checks and build
        working-directory: sites
        run: |
          npm test
          npm run build
          npm run validate

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy jma_data_mcp

      - name: Pytest (exclude integration)
        run: uv run pytest -m "not integration"

      - name: Build
        run: uv build

      - name: Verify clean wheel install
        shell: bash
        run: |
          WHEEL=$(find dist -name '*.whl' -print -quit)
          uv run --isolated --no-project --with "$WHEEL" python - <<'PY'
          import asyncio
          from jma_data_mcp.server import mcp
          from jma_data_mcp.stations import load_stations

          assert len(load_stations()) == 1286
          assert len(asyncio.run(mcp.list_tools())) == 11
          PY
