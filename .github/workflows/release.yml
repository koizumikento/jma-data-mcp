name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: |
          uv lock --check
          uv sync --frozen

      - name: Verify build trust bundle
        run: uv run --no-sync pytest tests/test_build_security.py

      - name: Build Windows executable
        run: >
          uv run --no-sync pyinstaller --clean --onefile --name jma-data-mcp
          --collect-data jma_data_mcp
          --copy-metadata fastmcp
          jma_data_mcp/__main__.py

      - name: Smoke test executable
        shell: pwsh
        run: |
          dist\jma-data-mcp.exe --help
          if ($LASTEXITCODE -ne 0) { throw "Executable help failed" }
          $output = dist\jma-data-mcp.exe station get --code 44132
          if ($LASTEXITCODE -ne 0) { throw "Station lookup failed" }
          $station = $output | ConvertFrom-Json
          if ($station.code -ne "44132") { throw "Station data missing or incorrect" }

      - name: Create SHA256 checksum
        shell: pwsh
        run: |
          $hash = Get-FileHash -Path dist\jma-data-mcp.exe -Algorithm SHA256
          "$($hash.Hash.ToLower())  jma-data-mcp.exe" | Out-File -FilePath SHA256SUMS.txt -Encoding ascii

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe
          path: |
            dist/jma-data-mcp.exe
            SHA256SUMS.txt

  release:
    runs-on: ubuntu-latest
    needs: build-windows
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-exe
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/dist/jma-data-mcp.exe
            release-assets/SHA256SUMS.txt
